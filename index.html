<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Your thinking deserves a canvas" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <link href="/src/index.css" rel="stylesheet" />
    <title>Nolenor</title>
    <!-- Applique le thème avant le premier paint (cf. src/lib/theme.ts). -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem("nolenor-theme");
          var dark =
            p === "dark" ||
            (p === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#0b1020");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Splash avant le JS : même markup que l'écran de chargement de l'app,
         qui le remplace à l'identique (cf. src/components/loading/BootLoader).
         Hors de #root, que main.tsx veut vide. -->
    <div
      id="boot-splash"
      class="loading-screen"
      style="position: fixed; z-index: 60"
      aria-hidden="true"
    >
      <div class="loading-screen__center">
        <img src="/favicon.svg" alt="" class="loading-screen__logo" />
        <div class="loading-screen__track">
          <div
            class="loading-screen__fill loading-screen__fill--crawl"
            style="--progress: 0.08"
          ></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
